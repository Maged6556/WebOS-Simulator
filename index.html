<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web OS Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- ======================== LOGIN SYSTEM ======================== -->
    <div id="login-screen" class="active">
        <div class="login-card glass">
            <div class="login-logo-container">
                <!-- Font Awesome Login Logo -->
                <i class="fa-brands fa-linux login-logo"></i>
            </div>
            <h2>Welcome</h2>
            <form id="login-form">
                <div class="input-group">
                    <input type="text" id="username" placeholder="Username" required autocomplete="off">
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <div class="error-message" id="login-error">Invalid username or password</div>
                <button type="submit" class="btn">Login</button>
            </form>
        </div>
    </div>
    <!-- Booting Screen -->
    <div id="boot-screen">
        <div class="boot-text">Starting Linux System...</div>
        <div class="spinner"></div>
    </div>
    <!-- ======================== DESKTOP SYSTEM ======================== -->
    <div id="d-screen">
        <!-- Desktop Icons -->
        <div class="d-icons" id="d-icons">
            <div class="d-icon" data-app="filemanager">
                <div class="icon-img"><i class="fa-solid fa-folder"></i></div>
                <span>Home</span>
            </div>
            <div class="d-icon" data-app="terminal">
                <div class="icon-img"><i class="fa-solid fa-terminal"></i></div>
                <span>Terminal</span>
            </div>
            <div class="d-icon" data-app="texteditor">
                <div class="icon-img"><i class="fa-solid fa-file-signature"></i></div>
                <span>Text Editor</span>
            </div>
            <div class="d-icon" data-app="sysmonitor">
                <div class="icon-img"><i class="fa-solid fa-chart-line"></i></div>
                <span>System Monitor</span>
            </div>
        </div>
        <!-- Window Container for draggable windows -->
        <div id="win-cont"></div>
        <!-- Desktop Right-Click Context Menu -->
        <div id="desktop-cm" class="glass">
            <div id="cm-new-folder">
                <i class="fa-solid fa-folder-plus"></i> New Folder
            </div>
            <div id="cm-new-file">
                <i class="fa-solid fa-file-circle-plus"></i> New File
            </div>
            <div id="cm-delete">
                <i class="fa-solid fa-trash"></i> Delete
            </div>
        </div>
        <!-- Taskbar -->
        <div class="tbar glass">
            <div class="tbar-l">
                <button id="start-btn" class="start-btn">
                    <i class="fa-brands fa-linux"></i>
                </button>
                <div class="tbar-apps" id="tbar-apps">
                    <!-- Running apps will be inserted here -->
                </div>
            </div>
            <div class="tbar-r">
                <div class="tbar-clk" id="clock">12:00 PM</div>
                <button id="u-btn" class="u-btn"><i class="fa-solid fa-user"></i></button>
                <div class="u-menu popup glass" id="u-menu">
                    <button id="logout-btn">Logout</button>
                </div>
                <div class="cal-pop popup glass" id="cal-pop">
                    <div class="cal-hdr">
                        <span id="cal-month-year"></span>
                    </div>
                    <div class="cal-grid" id="cal-days-grid"></div>
                </div>
            </div>
        </div>
    </div>
    <!-- START MENU POPUP -->
    <div id="s-menu" class="s-menu popup glass">
        <h3>Apps</h3>
        <div class="s-list">
            <div class="s-item" data-app="filemanager"><i class="fa-solid fa-folder"></i> File Manager</div>
            <div class="s-item" data-app="terminal"><i class="fa-solid fa-terminal"></i> Terminal</div>
            <div class="s-item" data-app="texteditor"><i class="fa-solid fa-file-signature"></i> Text Editor</div>
            <div class="s-item" data-app="sysmonitor"><i class="fa-solid fa-chart-line"></i> System Monitor</div>
        </div>
    </div>
    <!-- WINDOW TEMPLATES (Hidden, cloned by JS) -->
    <template id="window-template">
        <div class="window glass">
            <!-- Resize handles -->
            <div class="resize-handle resize-n"></div>
            <div class="resize-handle resize-s"></div>
            <div class="resize-handle resize-e"></div>
            <div class="resize-handle resize-w"></div>
            <div class="resize-handle resize-ne"></div>
            <div class="resize-handle resize-nw"></div>
            <div class="resize-handle resize-se"></div>
            <div class="resize-handle resize-sw"></div>
            <div class="win-hdr">
                <span class="win-title">App</span>
                <div class="win-ctrl">
                    <button class="min-btn"><i class="fa-solid fa-minus"></i></button>
                    <button class="max-btn"><i class="fa-solid fa-expand"></i></button>
                    <button class="cls-btn"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>
            <div class="win-body"></div>
        </div>
    </template>
    <template id="app-filemanager">
        <div class="fm-cont">
            <div class="fm-side">
                <ul>
                    <li class="active">Home</li>
                </ul>
            </div>
            <div class="fm-main">
                <div class="fm-tool">
                    <button class="fm-btn" id="fm-up"><i class="fa-solid fa-arrow-up"></i></button>
                    <div class="fm-bread">/home/admin</div>
                </div>
                <div class="fm-tool">
                    <button class="fm-btn" id="fm-new-folder">New Folder</button>
                    <button class="fm-btn" id="fm-new-file">New File</button>
                    <button class="fm-btn" id="fm-delete">Delete</button>
                </div>
                <div class="fm-grid">
                    <!-- dynamically populated -->
                </div>
            </div>
        </div>
    </template>
    <template id="app-terminal">
        <div class="app-terminal-content">
            <div class="term-out">
                <div>Welcome to WebOS Terminal.</div>
                <div>Type 'help' for a list of commands.</div>
            </div>
            <div class="term-in-line">
                <span class="prompt">admin@webos:~$</span>
                <input type="text" class="term-in" autocomplete="off" spellcheck="false">
            </div>
        </div>
    </template>
    <template id="app-texteditor">
        <div class="app-texteditor-content">
            <div class="te-toolbar">
                <button class="te-btn" id="te-save">Save</button>
                <button class="te-btn" id="te-clear">Clear</button>
                <span class="te-status"></span>
            </div>
            <textarea class="te-textarea" placeholder="Start typing..."></textarea>
        </div>
    </template>
    <template id="app-sysmonitor">
        <div class="app-sm-cont">
            <div class="sm-ram-bar-container">
                <div class="sm-ram-label">Memory: <span id="sm-ram-text">0 / 512 MB</span></div>
                <div class="sm-ram-bar">
                    <div class="sm-ram-fill" id="sm-ram-fill" style="width: 0%"></div>
                </div>
            </div>
            <table class="sm-table">
                <thead>
                    <tr>
                        <th>PID</th>
                        <th>Name</th>
                        <th>Status</th>
                        <th>Memory</th>
                    </tr>
                </thead>
                <tbody id="sm-tbody">
                </tbody>
            </table>
        </div>
    </template>
    <script src="script.js"></script>
</body>

</html>
